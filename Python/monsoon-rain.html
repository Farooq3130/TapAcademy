<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Rain - Monsoon</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #0a0f1a; font-family: system-ui, sans-serif; }
    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      padding: 24px;
    }
    .overlay h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      color: #e2e8f0;
      text-shadow: 0 2px 20px rgba(0,0,0,.6);
      font-weight: 300;
      letter-spacing: 2px;
    }
    .overlay h1 span {
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .overlay p {
      color: #94a3b8;
      font-size: clamp(1rem, 2vw, 1.3rem);
      margin-top: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>
  <div class="overlay">
    <h1>first <span>monsoon</span></h1>
    <p>&#x2726; the earth breathes again &#x2726;</p>
  </div>

  <script>
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');

    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const DROPS = 400;
    const drops = [];

    class Drop {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * W;
        this.y = Math.random() * -H;
        this.len = 8 + Math.random() * 18;
        this.speed = 6 + Math.random() * 12;
        this.opacity = 0.2 + Math.random() * 0.5;
        this.wind = -0.5 + Math.random() * 1.5;
        this.thickness = Math.random() < 0.2 ? 2 : 1;
        this.splash = 0;
      }
      fall() {
        this.y += this.speed;
        this.x += this.wind;
        if (this.y > H + 20) {
          this.splash = 1;
          this.reset();
        }
      }
      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + this.wind * 3, this.y - this.len);
        ctx.strokeStyle = `rgba(174, 194, 224, ${this.opacity})`;
        ctx.lineWidth = this.thickness;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    for (let i = 0; i < DROPS; i++) {
      const d = new Drop();
      d.y = Math.random() * H;
      drops.push(d);
    }

    let lightningTimer = 0;
    let lightningAlpha = 0;

    function drawLightning() {
      if (lightningAlpha > 0) {
        ctx.fillStyle = `rgba(200, 220, 255, ${lightningAlpha})`;
        ctx.fillRect(0, 0, W, H);
        lightningAlpha *= 0.92;
        if (lightningAlpha < 0.01) lightningAlpha = 0;
      }
    }

    function triggerLightning() {
      lightningAlpha = 0.12 + Math.random() * 0.15;
    }

    function drawGround() {
      const grd = ctx.createLinearGradient(0, H - 40, 0, H);
      grd.addColorStop(0, 'rgba(15, 23, 42, 0)');
      grd.addColorStop(0.3, 'rgba(15, 23, 42, 0.3)');
      grd.addColorStop(1, 'rgba(15, 23, 42, 0.7)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, H - 40, W, 40);
    }

    function animate() {
      ctx.fillStyle = 'rgba(10, 15, 26, 0.12)';
      ctx.fillRect(0, 0, W, H);

      drawLightning();
      drawGround();

      for (const d of drops) {
        d.fall();
        d.draw();
      }

      lightningTimer++;
      if (lightningTimer > 180 + Math.random() * 300) {
        triggerLightning();
        lightningTimer = 0;
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
